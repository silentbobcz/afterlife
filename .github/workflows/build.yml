name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Afterlife.sln

      - name: Build
        run: dotnet build Afterlife.sln -c Release --no-restore

      - name: Test (fake game install, crash injection at every step)
        run: dotnet test tests/Afterlife.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      # only AFTERLIFE Offline is released while Nexus Mods has not registered AFTERLIFE (AppEdition.cs).
      # A plain folder, not a single-file bundle: Nexus Mods sends self-extracting executables to manual review.
      - name: Publish AFTERLIFE Offline
        run: dotnet publish src/Afterlife.App -c Release -r win-x64 --self-contained -p:Edition=Offline -o publish/offline

      - name: Package
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $pg = $props.Project.PropertyGroup
          $v = if ($pg.VersionSuffix) { "$($pg.VersionPrefix)-$($pg.VersionSuffix)" } else { "$($pg.VersionPrefix)" }
          # a tag must match the version in Directory.Build.props (v1.0.0-alpha <-> 1.0.0-alpha)
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME does not match version $v in Directory.Build.props" }
          if (-not (Test-Path publish/offline/AFTERLIFE.exe)) { throw "AFTERLIFE.exe missing in publish/offline" }
          # the zip holds one folder AFTERLIFE with the app and its libraries side by side
          $dir = "dist/AFTERLIFE"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item publish/offline/* $dir -Recurse
          Get-ChildItem $dir -Filter *.pdb -Recurse | Remove-Item
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.txt $dir
          $zip = "dist/AFTERLIFE-Offline-$v-win-x64.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "$zip.sha256"
          Write-Host "$((Get-ChildItem $dir -Recurse -File).Count) files in $zip"

      # a test build of the full edition for the owner, only when the workflow is started by hand;
      # it is an artifact of the run and never part of a release
      - name: Test build of the full edition
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          dotnet publish src/Afterlife.App -c Release -r win-x64 --self-contained -o publish/full
          if ((Get-FileHash publish/full/AFTERLIFE.dll).Hash -eq (Get-FileHash publish/offline/AFTERLIFE.dll).Hash) { throw "The full build is identical to AFTERLIFE Offline" }
          $dir = "test/AFTERLIFE"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item publish/full/* $dir -Recurse
          Get-ChildItem $dir -Filter *.pdb -Recurse | Remove-Item
          Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.txt $dir
          Compress-Archive -Path $dir -DestinationPath "test/AFTERLIFE-test-$($env:GITHUB_SHA.Substring(0,7))-win-x64.zip"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: AFTERLIFE-full-test
          path: test/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AFTERLIFE-win-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/Afterlife.Tests/TestResults

  release:
    # a pushed tag vX.Y.Z[-suffix] publishes the next GitHub release with the zip, its SHA-256
    # and the matching section of CHANGELOG.md; a suffix (alpha, beta, rc) makes it a pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AFTERLIFE-win-x64
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## / { if (found) exit; split($0, h, " "); if (h[2] == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No section '## $v' in CHANGELOG.md" >&2; exit 1; fi
          {
            echo
            echo "---"
            echo "**Download:** \`AFTERLIFE-Offline-$v-win-x64.zip\` below, unzip anywhere outside the game folder and run \`AFTERLIFE.exe\` in the folder AFTERLIFE (Windows 10/11 64-bit, .NET included). Keep the whole folder together."
            echo "This is AFTERLIFE Offline, the edition published on Nexus Mods: no API key and no connection to Nexus Mods until Nexus Mods registers AFTERLIFE."
            echo "Not code-signed yet: on the SmartScreen warning click *More info* → *Run anyway*. Check the download with the \`.sha256\` file."
          } >> notes.md
          case "$v" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV";; *) echo "PRERELEASE=false" >> "$GITHUB_ENV";; esac

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: AFTERLIFE ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          make_latest: true
          files: |
            dist/*.zip
            dist/*.sha256
