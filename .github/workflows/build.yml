name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Afterlife.sln

      - name: Build
        run: dotnet build Afterlife.sln -c Release --no-restore

      - name: Test (fake game install, crash injection at every step)
        run: dotnet test tests/Afterlife.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      # A release on GitHub carries the full edition (zip and installer) and the AFTERLIFE Offline zip. Nexus Mods gets
      # only the Offline zip while it has not registered AFTERLIFE (AppEdition.cs).
      # Plain folders, not single-file bundles: Nexus Mods sends self-extracting executables to manual review.
      - name: Publish the full edition
        run: dotnet publish src/Afterlife.App -c Release -r win-x64 --self-contained -o publish/full

      - name: Publish AFTERLIFE Offline
        run: dotnet publish src/Afterlife.App -c Release -r win-x64 --self-contained -p:Edition=Offline -o publish/offline

      # the marked test build for Nexus Mods (AppEdition.OAuthPreview); goes away once the client ID is built in
      - name: Publish the OAuth preview
        run: dotnet publish src/Afterlife.App -c Release -r win-x64 --self-contained -p:Edition=OAuthPreview -o publish/oauth

      - name: Package
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $pg = $props.Project.PropertyGroup
          $v = if ($pg.VersionSuffix) { "$($pg.VersionPrefix)-$($pg.VersionSuffix)" } else { "$($pg.VersionPrefix)" }
          # a tag must match the version in Directory.Build.props (v1.0.0-alpha <-> 1.0.0-alpha)
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME does not match version $v in Directory.Build.props" }
          if ((Get-FileHash publish/full/AFTERLIFE.dll).Hash -eq (Get-FileHash publish/offline/AFTERLIFE.dll).Hash) { throw "The full build is identical to AFTERLIFE Offline" }
          New-Item -ItemType Directory -Force dist | Out-Null
          # each zip holds one folder AFTERLIFE with the app and its libraries side by side
          if ((Get-FileHash publish/full/AFTERLIFE.dll).Hash -eq (Get-FileHash publish/oauth/AFTERLIFE.dll).Hash) { throw "The full build is identical to the OAuth preview" }
          foreach ($e in @(@{ From = 'full'; Zip = "AFTERLIFE-$v-win-x64.zip" }, @{ From = 'offline'; Zip = "AFTERLIFE-Offline-$v-win-x64.zip" }, @{ From = 'oauth'; Zip = "AFTERLIFE-OAuth-Preview-$($pg.VersionPrefix)-$($pg.OAuthPreviewSuffix)-win-x64.zip" })) {
            if (-not (Test-Path "publish/$($e.From)/AFTERLIFE.exe")) { throw "AFTERLIFE.exe missing in publish/$($e.From)" }
            $dir = "stage/$($e.From)/AFTERLIFE"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Copy-Item "publish/$($e.From)/*" $dir -Recurse
            Get-ChildItem $dir -Filter *.pdb -Recurse | Remove-Item
            Copy-Item README.md, LICENSE, THIRD-PARTY-NOTICES.txt $dir
            if ($e.From -eq 'oauth') {
              Copy-Item installer/OAUTH-PREVIEW.txt $dir
              "# Write the Nexus Mods OAuth client ID on the next line, save and start AFTERLIFE.exe (see OAUTH-PREVIEW.txt)" | Out-File -Encoding ascii "$dir/nexus-client-id.txt"
            }
            $zip = "dist/$($e.Zip)"
            Compress-Archive -Path $dir -DestinationPath $zip
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            "$hash  $($e.Zip)" | Out-File -Encoding ascii "$zip.sha256"
            Write-Host "$((Get-ChildItem $dir -Recurse -File).Count) files in $zip"
          }
          "AFTERLIFE_VERSION=$v" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV

      # a per-user installer of the full edition, built from the same folder as its zip; on GitHub only, never on Nexus Mods
      - name: Installer
        shell: pwsh
        run: |
          # Inno Setup 6 may be preinstalled on GitHub's Windows runners; install it only when it is missing
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE -ne 0) { throw "Inno Setup could not be installed" } }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $v = $env:AFTERLIFE_VERSION
          $name = "AFTERLIFE-$v-win-x64-Setup"
          & $iscc /Q "/DAppVersion=$v" "/DDistDir=$((Resolve-Path stage/full/AFTERLIFE).Path)" "/O$((Resolve-Path dist).Path)" "/F$name" installer/AFTERLIFE.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "dist/$name.exe"
          if (-not (Test-Path $setup)) { throw "$setup missing" }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.exe" | Out-File -Encoding ascii "$setup.sha256"
          Write-Host "$setup $((Get-Item $setup).Length) bytes"

      # a test build of the full edition for the owner, only when the workflow is started by hand;
      # it is an artifact of the run and never part of a release
      - name: Test build of the full edition
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0,7)
          New-Item -ItemType Directory -Force test | Out-Null
          Copy-Item "dist/AFTERLIFE-$env:AFTERLIFE_VERSION-win-x64.zip" "test/AFTERLIFE-test-$sha-win-x64.zip"
          Copy-Item "dist/AFTERLIFE-$env:AFTERLIFE_VERSION-win-x64-Setup.exe" "test/AFTERLIFE-test-$sha-win-x64-Setup.exe"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: AFTERLIFE-full-test
          path: test/*

      - uses: actions/upload-artifact@v4
        with:
          name: AFTERLIFE-win-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/Afterlife.Tests/TestResults

  release:
    # a pushed tag vX.Y.Z[-suffix] publishes the next GitHub release with the two zips, the installer, their SHA-256
    # and the matching section of CHANGELOG.md; a suffix (alpha, beta, rc) makes it a pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AFTERLIFE-win-x64
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## / { if (found) exit; split($0, h, " "); if (h[2] == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No section '## $v' in CHANGELOG.md" >&2; exit 1; fi
          {
            echo
            echo "---"
            echo "**Download** (Windows 10/11 64-bit, .NET included):"
            echo "- \`AFTERLIFE-$v-win-x64-Setup.exe\` · recommended. The installer of the full edition: installs for your Windows user only (no admin rights) with a Start menu shortcut and an uninstaller. Neither the installer nor the uninstaller ever deletes your library or settings."
            echo "- \`AFTERLIFE-$v-win-x64.zip\` · the same full edition as a folder: unzip anywhere outside the game folder and run \`AFTERLIFE.exe\` in the folder AFTERLIFE. Keep the whole folder together."
            echo "- \`AFTERLIFE-Offline-$v-win-x64.zip\` · AFTERLIFE Offline, the edition published on Nexus Mods: the same app without any connection to Nexus Mods (no API key, no downloads, updates or collections) until Nexus Mods registers AFTERLIFE."
            echo "- \`AFTERLIFE-OAuth-Preview-…-win-x64.zip\` · **not for normal use.** A marked test build with a version of its own for Nexus Mods to try the new *Log in with Nexus Mods* (OAuth 2.0 with PKCE); it needs an OAuth client ID, see \`OAUTH-PREVIEW.txt\` inside."
            echo
            echo "Updating from an older version: your library and settings stay. If your library is inside the old AFTERLIFE folder, do not delete that folder; see *Updating AFTERLIFE* in the user guide."
            echo "Not code-signed yet: on the SmartScreen warning click *More info* → *Run anyway*. Check a download with its \`.sha256\` file."
          } >> notes.md
          case "$v" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV";; *) echo "PRERELEASE=false" >> "$GITHUB_ENV";; esac

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: AFTERLIFE ${{ github.ref_name }}
          body_path: notes.md
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          make_latest: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
