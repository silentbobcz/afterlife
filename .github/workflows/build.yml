name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Afterlife.sln

      - name: Build
        run: dotnet build Afterlife.sln -c Release --no-restore

      - name: Test (fake game install, crash injection at every step)
        run: dotnet test tests/Afterlife.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish AFTERLIFE
        run: dotnet publish src/Afterlife.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/app

      - name: Package
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $v = $props.Project.PropertyGroup.Version
          $dir = "dist/AFTERLIFE-$v"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item publish/app/AFTERLIFE.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.txt $dir
          Copy-Item src/Afterlife.App/Assets/Fonts/OFL-*.txt $dir
          $zip = "dist/AFTERLIFE-$v-beta-win-x64.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: AFTERLIFE-win-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/Afterlife.Tests/TestResults

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AFTERLIFE-win-x64
          path: dist

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
