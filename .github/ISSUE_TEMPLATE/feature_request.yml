name: Feature request
description: An idea for AFTERLIFE
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
  - type: textarea
    id: other
    attributes:
      label: Anything else (other managers that do it, screenshots, links)
