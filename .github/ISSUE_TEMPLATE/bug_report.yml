name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: AFTERLIFE version
      description: Shown in About (for example 0.5.0)
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and game store
      placeholder: Windows 11 24H2, Steam
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Copy diagnostics, paste here. Check it first; it contains folder paths.
      render: text
    validations:
      required: true
  - type: textarea
    id: modlist
    attributes:
      label: Mod list
      description: Export list → Copy, paste here (optional, but very useful).
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag the latest file from %LOCALAPPDATA%\AFTERLIFE\logs here (optional).
